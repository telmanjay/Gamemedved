
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare project
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Не найден ZIP-архив проекта в корне репозитория"
            exit 1
          fi
          mkdir -p unpacked
          unzip -q "$ZIP_FILE" -d unpacked
          BUILD_FILE=$(find unpacked -type f -path '*/app/build.gradle' -o -path '*/app/build.gradle.kts' | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "В архиве не найден Android-проект с модулем app"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$(dirname "$BUILD_FILE")")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/medved-bogatyr.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: medved-bogatyr-apk
          path: medved-bogatyr.apk
          if-no-files-found: error
          retention-days: 14
