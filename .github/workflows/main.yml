name: Build Maga v Gorode APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract updated game project
        run: |
          set -e
          ZIP_FILE="maga-v-gorode-project.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "Upload maga-v-gorode-project.zip to the repository root first"
            exit 1
          fi
          rm -rf maga-v-gorode
          unzip -q "$ZIP_FILE" -d .
          test -f maga-v-gorode/app/build.gradle
      - name: Build APKs
        run: |
          set -e
          cd maga-v-gorode
          gradle --no-daemon assembleDebug assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/output/Maga-v-gorode-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/output/Maga-v-gorode-release.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Maga-v-gorode-APKs
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30
